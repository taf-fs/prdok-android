# Copy to secrets.properties and fill in real values.
# Same three keys as the iOS Config.plist.
apiBaseURL=https://example.com
employeePortalURL=https://example.com
pairingInitKey=replace-me

# Debug builds only: skip pairing by seeding an already-paired account at launch.
# Copy the values from a paired device (klic = device key, id/ids = server-resolved
# employee credentials, skladnik = lidauths query string, may be empty).
# Set enabled=true to turn it on, false (or remove) to turn it off; rebuild after changing.
devCredentials.enabled=false
devCredentials.klic=
devCredentials.id=
devCredentials.ids=
devCredentials.provoz=
devCredentials.skladnik=
